<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/flatly/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a href="/" class="navbar-brand">
                App Product
            </a>
        </div>
    </nav>
    
    <div class="container">
        <div id="app" class="row pt-5">
            
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h4>Add Product</h4>
                    </div>
                    <div class="card-body">
                        <form id="product-form">
                            <div class="form-group mb-3">
                                <input type="text" id="name" placeholder="Product Name" class="form-control">
                            </div>
                            <div class="form-group mb-3">
                                <input type="number" step="0.01" id="price" placeholder="Product Price" class="form-control">
                            </div>
                            <div class="form-group mb-3">
                                <input type="number" id="year" min="2001" value="2026" max="2026" placeholder="Product Year" class="form-control">
                            </div>
                            <input type="submit" value="Save" class="btn btn-primary btn-block w-100">
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div id="product-list"></div>
            </div>
            
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
